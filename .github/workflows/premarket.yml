name: premarket scan

# Runs the morning scan on GitHub's servers and keeps the dashboard as a build artifact.
# 12:40 UTC = 8:40 ET during daylight time (7:40 ET in winter). Turn on by uncommenting the schedule.
# Needs a repo secret SEC_USER_AGENT ("Your Name you@example.com") for 8-Ks and fundamentals.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "40 12 * * 1-5"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Premarket scan
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m scanner premarket --no-log 2>&1 | tee out/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: premarket-${{ github.run_id }}
          path: |
            out/dashboard.html
            out/premarket.md
            out/scan.json
      - name: Save results to the scan-results branch
        if: always()
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        run: |
          stamp=$(TZ=America/New_York date +%Y-%m-%d_%H%M)
          if ! git clone -q --depth 1 --branch scan-results "$REPO_URL" /tmp/res 2>/dev/null; then
            mkdir -p /tmp/res && cd /tmp/res && git init -q -b scan-results && git remote add origin "$REPO_URL" && cd -
          fi
          mkdir -p /tmp/res/latest "/tmp/res/history/$stamp"
          for f in dashboard.html premarket.md scan.json intraday.json run.log; do
            [ -f "out/$f" ] && cp "out/$f" /tmp/res/latest/ && cp "out/$f" "/tmp/res/history/$stamp/"
          done
          cd /tmp/res
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "scan $stamp" || exit 0
          git push -q origin HEAD:scan-results
